<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitLink - Login</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>
    <div class="logo-login">
        <img src="../img/logo.png" alt="Logo FitLink">
    </div>

    <form id="loginForm">

        <label>Email:</label>

        <input
            type="email"
            id="email"
            required
        >

        <br><br>

        <label>Senha:</label>

        <input
            type="password"
            id="senha"
            required
        >

        <br><br>

        <button type="submit">
            Entrar
        </button>

        <p>
            Ainda não possui uma conta?
        </p>

        <a href="cadastro.html">
            Cadastrar
        </a>

    </form>


    <script src="../js/login.js"></script>

</body>

</html>
